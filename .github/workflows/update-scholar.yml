name: Update Google Scholar citations

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Scholar updater
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Refresh Scholar snapshot
        run: python scripts/update_scholar.py
        env:
          ALLOW_STALE_SCHOLAR: "1"
      - name: Commit citation changes
        run: |
          if git diff --quiet -- data/scholar.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "new version"
          git push
